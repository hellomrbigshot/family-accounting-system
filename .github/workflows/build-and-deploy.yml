name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Check if version was manually updated
      id: version-check
      run: |
        LAST_COMMIT_MSG=$(git log -1 --pretty=%B)
        if [[ "$LAST_COMMIT_MSG" == *"chore: bump version"* ]]; then
          echo "manual_version_update=true" >> $GITHUB_OUTPUT
          echo "✅ 检测到手动版本更新，跳过自动版本更新"
        else
          echo "manual_version_update=false" >> $GITHUB_OUTPUT
          echo "📝 未检测到手动版本更新，将执行自动版本更新"
        fi

    - name: Update version
      run: |
        cd frontend
        if [[ "${{ steps.version-check.outputs.manual_version_update }}" != "true" ]]; then
          echo "🔄 执行自动版本更新..."
          node scripts/version.js patch
        else
          echo "⏭️  跳过自动版本更新"
        fi

    - name: Build project on CI
      run: |
        set -euo pipefail
        echo "🔨 在 GitHub Actions 构建前后端..."
        pnpm build
        test -f backend/dist/app.js
        test -f frontend/dist/index.html
        echo "✅ 构建产物校验通过"

    - name: Commit version changes
      if: steps.version-check.outputs.manual_version_update != 'true'
      run: |
        if [[ -n "$(git status --porcelain)" ]]; then
          git add .
          git commit -m "chore: bump version to $(node -p "require('./frontend/package.json').version") [skip ci]"
          git push origin main
        fi

    - name: Create Git tag
      run: |
        VERSION=$(node -p "require('./frontend/package.json').version")
        if git tag -l "v$VERSION" | grep -q "v$VERSION"; then
          echo "🏷️  标签 v$VERSION 已存在，跳过创建"
        else
          echo "🏷️  创建标签 v$VERSION"
          git tag -a "v$VERSION" -m "Release version $VERSION"
          git push origin "v$VERSION"
        fi

    - name: Upload build artifacts to server
      env:
        SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        SSH_HOST: ${{ secrets.ALIYUN_HOST }}
        SSH_USER: ${{ secrets.ALIYUN_USERNAME }}
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy
        ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

        tar czf /tmp/deploy-dist.tar.gz backend/dist frontend/dist
        scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
          /tmp/deploy-dist.tar.gz "${SSH_USER}@${SSH_HOST}:/tmp/deploy-dist.tar.gz"
        ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
          "${SSH_USER}@${SSH_HOST}" \
          "set -euo pipefail && cd /home/family-accounting-system && tar xzf /tmp/deploy-dist.tar.gz && rm -f /tmp/deploy-dist.tar.gz"
        rm -f /tmp/deploy-dist.tar.gz

    - name: Deploy to Aliyun
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.ALIYUN_HOST }}
        username: ${{ secrets.ALIYUN_USERNAME }}
        key: ${{ secrets.ALIYUN_SSH_KEY }}
        script_stop: true
        script: |
          set -euo pipefail

          export NODE_ENV=production
          export MONGODB_URI=${{ secrets.MONGODB_URI }}
          export JWT_SECRET=${{ secrets.JWT_SECRET }}
          export MIMO_API_KEY=${{ secrets.MIMO_API_KEY }}
          export MIMO_BASE_URL=${{ secrets.MIMO_BASE_URL }}
          export MIMO_MODEL=${{ secrets.MIMO_MODEL }}
          export MIMO_ASR_MODEL=${{ secrets.MIMO_ASR_MODEL }}

          if ! command -v pnpm &> /dev/null; then
            echo "Installing pnpm..."
            curl -fsSL https://get.pnpm.io/install.sh | sh -
            export PNPM_HOME="$HOME/.local/share/pnpm"
            export PATH="$PNPM_HOME:$PATH"
          fi

          cd /home/family-accounting-system

          echo "Pulling latest code..."
          git pull origin main
          git fetch --tags

          LATEST_VERSION=$(git describe --tags --abbrev=0)
          echo "Deploying version: $LATEST_VERSION"

          echo "Installing runtime dependencies..."
          NODE_ENV=development pnpm install --frozen-lockfile

          echo "Verifying build artifacts..."
          test -f backend/dist/app.js
          test -f frontend/dist/index.html

          echo "Restarting services..."
          if pm2 describe family-accounting > /dev/null 2>&1; then
            pm2 restart family-accounting --update-env
          else
            pm2 start ecosystem.config.js --update-env
          fi

          echo "Waiting for service to start..."
          sleep 10

          echo "Performing health check..."
          curl -f http://localhost:3000/api/health
          echo "Deployment successful! Version: $LATEST_VERSION"
