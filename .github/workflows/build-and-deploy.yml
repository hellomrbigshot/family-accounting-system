name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Check if version was manually updated
      id: version-check
      run: |
        LAST_COMMIT_MSG=$(git log -1 --pretty=%B)
        if [[ "$LAST_COMMIT_MSG" == *"chore: bump version"* ]]; then
          echo "manual_version_update=true" >> $GITHUB_OUTPUT
          echo "✅ 检测到手动版本更新，跳过自动版本更新"
        else
          echo "manual_version_update=false" >> $GITHUB_OUTPUT
          echo "📝 未检测到手动版本更新，将执行自动版本更新"
        fi

    - name: Update version
      run: |
        cd frontend
        if [[ "${{ steps.version-check.outputs.manual_version_update }}" != "true" ]]; then
          echo "🔄 执行自动版本更新..."
          node scripts/version.js patch
        else
          echo "⏭️  跳过自动版本更新"
        fi

    - name: Build project on CI
      run: |
        set -euo pipefail
        echo "🔨 在 GitHub Actions 构建前后端..."
        pnpm build
        test -f backend/dist/app.js
        test -f frontend/dist/index.html
        echo "✅ 构建产物校验通过"

    - name: Commit version changes
      if: steps.version-check.outputs.manual_version_update != 'true'
      run: |
        if [[ -n "$(git status --porcelain)" ]]; then
          git add .
          git commit -m "chore: bump version to $(node -p "require('./frontend/package.json').version") [skip ci]"
          git push origin main
        fi

    - name: Create Git tag
      run: |
        VERSION=$(node -p "require('./frontend/package.json').version")
        if git tag -l "v$VERSION" | grep -q "v$VERSION"; then
          echo "🏷️  标签 v$VERSION 已存在，跳过创建"
        else
          echo "🏷️  创建标签 v$VERSION"
          git tag -a "v$VERSION" -m "Release version $VERSION"
          git push origin "v$VERSION"
        fi

    - name: Parse SSH target
      id: ssh
      env:
        SSH_HOST: ${{ secrets.ALIYUN_HOST }}
      run: |
        if [[ "$SSH_HOST" == *:* ]]; then
          echo "host=${SSH_HOST%%:*}" >> $GITHUB_OUTPUT
          echo "port=${SSH_HOST##*:}" >> $GITHUB_OUTPUT
        else
          echo "host=$SSH_HOST" >> $GITHUB_OUTPUT
          echo "port=22" >> $GITHUB_OUTPUT
        fi

    - name: Upload build artifacts to server
      env:
        SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        SSH_HOST: ${{ steps.ssh.outputs.host }}
        SSH_PORT: ${{ steps.ssh.outputs.port }}
        SSH_USER: ${{ secrets.ALIYUN_USERNAME }}
      run: |
        set -eo pipefail
        mkdir -p ~/.ssh
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy
        ssh-keyscan -H "$SSH_HOST" -p "$SSH_PORT" >> ~/.ssh/known_hosts 2>/dev/null || true

        tar czf /tmp/deploy-dist.tar.gz backend/dist frontend/dist
        SFTP_BATCH=$(mktemp)
        echo 'put /tmp/deploy-dist.tar.gz /tmp/deploy-dist.tar.gz' > "$SFTP_BATCH"
        sftp -i ~/.ssh/id_deploy -P "$SSH_PORT" -o StrictHostKeyChecking=no -b "$SFTP_BATCH" \
          "${SSH_USER}@${SSH_HOST}"
        rm -f "$SFTP_BATCH"
        ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o StrictHostKeyChecking=no \
          "${SSH_USER}@${SSH_HOST}" \
          "cd /home/family-accounting-system && tar xzf /tmp/deploy-dist.tar.gz && rm -f /tmp/deploy-dist.tar.gz"
        rm -f /tmp/deploy-dist.tar.gz

    - name: Deploy to Aliyun
      env:
        SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        SSH_HOST: ${{ steps.ssh.outputs.host }}
        SSH_PORT: ${{ steps.ssh.outputs.port }}
        SSH_USER: ${{ secrets.ALIYUN_USERNAME }}
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
        MIMO_BASE_URL: ${{ secrets.MIMO_BASE_URL }}
        MIMO_MODEL: ${{ secrets.MIMO_MODEL }}
        MIMO_ASR_MODEL: ${{ secrets.MIMO_ASR_MODEL }}
      run: |
        set -eo pipefail
        mkdir -p ~/.ssh
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy
        ssh-keyscan -H "$SSH_HOST" -p "$SSH_PORT" >> ~/.ssh/known_hosts 2>/dev/null || true

        DEPLOY_SCRIPT=$(mktemp)
        {
          echo 'set -e'
          echo 'export NODE_ENV=production'
          echo "export MONGODB_URI=$(printf '%q' "$MONGODB_URI")"
          echo "export JWT_SECRET=$(printf '%q' "$JWT_SECRET")"
          echo "export MIMO_API_KEY=$(printf '%q' "$MIMO_API_KEY")"
          echo "export MIMO_BASE_URL=$(printf '%q' "$MIMO_BASE_URL")"
          echo "export MIMO_MODEL=$(printf '%q' "$MIMO_MODEL")"
          echo "export MIMO_ASR_MODEL=$(printf '%q' "$MIMO_ASR_MODEL")"
          echo 'if ! command -v pnpm &> /dev/null; then'
          echo '  echo "Installing pnpm..."'
          echo '  curl -fsSL https://get.pnpm.io/install.sh | sh -'
          echo '  export PNPM_HOME="$HOME/.local/share/pnpm"'
          echo '  export PATH="$PNPM_HOME:$PATH"'
          echo 'fi'
          echo 'cd /home/family-accounting-system'
          echo 'echo "Pulling latest code..."'
          echo 'git pull origin main'
          echo 'git fetch --tags'
          echo 'LATEST_VERSION=$(git describe --tags --abbrev=0)'
          echo 'echo "Deploying version: $LATEST_VERSION"'
          echo 'echo "Installing runtime dependencies..."'
          echo 'NODE_ENV=development pnpm install --frozen-lockfile'
          echo 'echo "Verifying build artifacts..."'
          echo 'test -f backend/dist/app.js'
          echo 'test -f frontend/dist/index.html'
          echo 'echo "Restarting services..."'
          echo 'if pm2 describe family-accounting > /dev/null 2>&1; then'
          echo '  pm2 restart family-accounting --update-env'
          echo 'else'
          echo '  pm2 start ecosystem.config.js --update-env'
          echo 'fi'
          echo 'echo "Waiting for service to start..."'
          echo 'sleep 10'
          echo 'echo "Performing health check..."'
          echo 'curl -f http://localhost:3000/api/health'
          echo 'echo "Deployment successful! Version: $LATEST_VERSION"'
        } > "$DEPLOY_SCRIPT"

        ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o StrictHostKeyChecking=no \
          "${SSH_USER}@${SSH_HOST}" bash -s < "$DEPLOY_SCRIPT"
        rm -f "$DEPLOY_SCRIPT"
